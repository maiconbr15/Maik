<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tem um segredo aqui... 🔐❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff4d6d, #7b2cbf);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    overflow: hidden;
}

.box {
    width: 90%;
    max-width: 420px;
    padding: 35px 25px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.lock {
    font-size: 90px;
    animation: flutuar 2s infinite;
}

h1 {
    font-size: 30px;
}

p {
    font-size: 17px;
    line-height: 1.6;
}

input {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    outline: none;
    text-align: center;
    font-size: 20px;
    margin: 15px 0;
}

button {
    border: none;
    padding: 15px 30px;
    border-radius: 30px;
    background: white;
    color: #d6336c;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.08);
}

.erro {
    color: #ffd6e0;
    min-height: 25px;
}

.hidden {
    display: none;
}

.unlocked {
    animation: desbloquear 1s forwards;
}

.heart {
    position: fixed;
    top: -30px;
    animation: cair linear forwards;
}

@keyframes flutuar {
    50% {
        transform: translateY(-12px) rotate(5deg);
    }
}

@keyframes desbloquear {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.2) rotate(3deg);
    }
    100% {
        transform: scale(0);
        opacity: 0;
    }
}

@keyframes cair {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="box" id="cadeado">

    <div class="lock" id="lock">🔐</div>

    <h1>Tem um segredo aqui... 👀</h1>

    <p>
        Mas antes de entrar você precisa descobrir
        a <b>palavra-chave</b>. 🤫
    </p>

    <p>
        Dica: começa com <b>M</b>... 😏
    </p>

    <input
        type="password"
        id="senha"
        placeholder="Digite a palavra-chave"
        onkeydown="if(event.key==='Enter') verificar()"
    >

    <button onclick="verificar()">
        🔓 DESBLOQUEAR
    </button>

    <p class="erro" id="erro"></p>

</div>

<script>

function verificar() {

    const senha = document
        .getElementById("senha")
        .value
        .trim()
        .toLowerCase();

    const erro = document.getElementById("erro");
    const cadeado = document.getElementById("cadeado");
    const lock = document.getElementById("lock");

    if (senha === "maik") {

        lock.innerHTML = "🔓";

        cadeado.classList.add("unlocked");

        for (let i = 0; i < 50; i++) {
            criarCoracao();
        }

        setTimeout(() => {

            // COLOQUE AQUI O LINK DA PÁGINA PRINCIPAL
            window.location.href = "principal.html";

        }, 900);

    } else {

        lock.innerHTML = "🔒";

        erro.innerHTML =
            "❌ Senha errada! Você não vai desistir tão fácil, né? 😂❤️";

        document.getElementById("senha").value = "";

    }
}

function criarCoracao() {

    const heart = document.createElement("div");

    heart.className = "heart";

    const emojis = [
        "❤️","💖","💕","💘",
        "💗","🥰","😍","✨"
    ];

    heart.innerHTML =
        emojis[Math.floor(Math.random() * emojis.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (2 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}

</script>

</body>
</html>
